development:
  adapter: redis
  url: <%= ENV.fetch("INTEGRATION_CONSOLE_REDIS_URL", "redis://127.0.0.1:6379/1") %>
<% if (password = ENV["INTEGRATION_CONSOLE_REDIS_PASSWORD"]) && !password.empty? %>
  password: <%= password.inspect %>
<% end %>

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV["INTEGRATION_CONSOLE_REDIS_URL"] || "redis://127.0.0.1:6379/1" %>
<% if (password = ENV["INTEGRATION_CONSOLE_REDIS_PASSWORD"]) && !password.empty? %>
  password: <%= password.inspect %>
<% end %>
